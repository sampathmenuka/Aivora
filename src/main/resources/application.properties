spring.application.name=digitalstore-backend
# ===============================
# SERVER
# ===============================
server.port=8080
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001

# ===============================
# DATASOURCE (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/digital_store
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

stripe.secretKey=${STRIPE_SECRET_KEY:}
stripe.webhookSecret=${STRIPE_WEBHOOK_SECRET:}
stripe.currency=usd

# ===============================
# DEMO DATA (development only)
# ===============================
# Set SEED_DATA=true to fill an empty database with demo users, products, orders and reviews.
# All demo accounts use the password "password123", so never enable this in production.
app.seed.enabled=${SEED_DATA:false}
app.seed.files-dir=${SEED_FILES_DIR:${user.home}/.digitalstore/demo-files}